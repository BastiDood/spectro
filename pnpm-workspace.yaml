allowBuilds:
  esbuild: true
  protobufjs: false

cleanupUnusedCatalogs: true

engineStrict: true

minimumReleaseAgeStrict: true

overrides:
  '@inngest/ai@0.1.7>@types/node': '-'
  '@inngest/ai@0.1.7>typescript': '-'

tasks:
  ci:
    dependsOn:
      - fmt
      - lint
      - test:run
  lint:
    dependsOn:
      - lint:eslint
      - lint:svelte

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - ts-api-utils@2.3.0
