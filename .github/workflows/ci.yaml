name: Code Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build SvelteKit
    runs-on: ubuntu-latest
    env:
      SPECTRO_DATABASE_DRIVER: neon
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set Up pnpm and Install Dependencies
        uses: pnpm/setup@v3.2.0
        with:
          cache: true
          require-lockfile: true
      - parallel:
          - name: Check Formatters
            run: pnpm fmt
          - name: Lint with ESLint
            run: pnpm lint:eslint
          - name: Lint with Svelte Check
            run: pnpm lint:svelte
          - name: Run Unit Tests
            run: pnpm test:run
