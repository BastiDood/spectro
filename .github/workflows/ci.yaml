name: Code Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build SvelteKit
    runs-on: ubuntu-latest
    env:
      PUBLIC_ORIGIN: https://spectro.bastidood.dev
      SPECTRO_DATABASE_DRIVER: neon
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Code Quality Tasks
        run: pnpm --recursive --workspace-root --if-present run ci
